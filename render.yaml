# Render Blueprint: én webservice med vedvarende disk til SQLite-databasen.
# Persistente diske kræver en betalt instanstype hos Render.
services:
  - type: web
    name: ballet-ugeskema
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: ugeskema-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
